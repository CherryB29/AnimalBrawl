<style>
  html, body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: #e9ecef; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }

  @keyframes popIn { 0%{transform:scale(.2) rotate(-12deg);opacity:0} 60%{transform:scale(1.12) rotate(3deg);opacity:1} 100%{transform:scale(1) rotate(0)} }
  @keyframes bounceY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes fadeOut { from{opacity:1} to{opacity:0} }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes slideUp { from{transform:translateY(18px);opacity:0} to{transform:translateY(0);opacity:1} }

  @keyframes slotPop { 0%{transform:scale(.8)} 60%{transform:scale(1.08)} 100%{transform:scale(1)} }
  @keyframes pulseRing { 0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.45)} 50%{box-shadow:0 0 0 7px rgba(59,130,246,0)} }

  .anim-pop { animation: popIn .6s cubic-bezier(.2,1.3,.4,1) both; }

  .anim-fade { animation: fadeIn .25s ease both; }
  .anim-fadeout { animation: fadeOut .45s ease both; }
  .anim-slide { animation: slideUp .35s cubic-bezier(.2,.8,.2,1) both; }

/* ===================== 상태 ===================== */
function freshState() { return { gold: INIT_GOLD, stage: 1, sel: 1, own: { f:{}, s:{} }, eq: { f:null, s:[null,null,null] }, set: { lose:'retry' } }; }
let state = load();

let sel = { type:'skill', idx:0 };
const battleLog = [];
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { const s = JSON.parse(raw), d = freshState(); if (s && s.own && s.eq) return Object.assign(d, s, { set: Object.assign(d.set, s.set||{}) }); }
  } catch (e) {}
  return freshState();
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }

/* ===================== 유틸 ===================== */
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const tierOf = k => TIERS[TIER_IDX[k]];
const F = id => FIGHTERS.find(f => f.id === id);
const SK = id => SKILLS.find(s => s.id === id);
const owned = (kind, id) => state.own[kind][id] || 0;
const poolOf = kind => kind === 'f' ? FIGHTERS : SKILLS;
const baseOf = (kind, id) => kind === 'f' ? F(id) : SK(id);
function rollTier(min) {
  const list = TIERS.filter((t,i) => i >= (min||0));
  const total = list.reduce((a,t) => a + t.p, 0);
  let r = Math.random()*total, acc = 0;
  for (const t of list) { acc += t.p; if (r < acc) return t.k; }
  return list[0].k;
}
function rollItem(kind, min) {
  const tier = rollTier(min), pool = poolOf(kind).filter(x => x.tier === tier);
  return pool[Math.floor(Math.random()*pool.length)];
}
function fighterStats(b) {
  const m = tierOf(b.tier).m;
  return { hp: Math.round(b.hp*m), atk: Math.round(b.atk*m), def: Math.round(b.def*m), spd: Math.round(b.spd*m) };
}
function powerOf(st, entries) {
  let p = st.hp/5 + st.atk*3 + st.def*3 + Math.min(st.spd,220)/2;
  for (const en of entries) {
    const b = en.base; let v;
    if (b.shape === 'zone') v = b.heal ? 15*en.mult : (b.tickDmg*en.mult*(b.dur/b.tick))/b.cd*1.2;
    else if (b.shape === 'shower') v = (b.dmg*en.mult*b.n*0.5)/b.cd*2;
    else if (b.shape === 'flurry') v = (b.dmg*en.mult*b.hits*0.4)/b.cd*2;
    else if (b.self || b.shape === 'bind') v = 20*en.mult;
    else v = (b.dmg*en.mult*(b.n||1)*(b.n>1?0.55:1))/b.cd*2;
    p += v;
  }
  return Math.round(p);
}
const skillEntries = () => state.eq.s.filter(Boolean).map(id => ({ base: SK(id), mult: tierOf(SK(id).tier).m }));

function calcStyle(fmc, entries) {
  let sum = fmc, w = 1;
  for (const en of entries) { if (en.base.self) continue; sum += en.base.mc; w += 1; }
  const c = sum / w;
  const label = c < 0.3 ? '원거리 저격형' : c < 0.5 ? '견제형' : c < 0.7 ? '균형형' : '돌격형';
  const desc = c < 0.3 ? '거리를 벌리고 저격하며, 접근하면 이탈해요'
             : c < 0.5 ? '안전거리에서 견제하고 틈을 노려요'
             : c < 0.7 ? '상황에 따라 거리를 조절해 교전해요'
             : '돌진해 근접전을 벌이고 후딜을 노려요';
  return { c, aggr: 0.2 + 0.8*c, pref: 250 + (62-250)*c, label, desc };
}
const myStyle = () => state.eq.f ? calcStyle(F(state.eq.f).mc, skillEntries()) : null;
function bossStats(stage) {
  const s = stage - 1;
  return { hp: Math.round(170*(1+0.36*s)*(1+0.008*s*s)), atk: Math.round(13+s*3.6), def: Math.round(2+s*1.5), spd: Math.min(140, 85+Math.round(stage*2.5)) };
}
function bossInfo(stage) {
  const kit = BOSS_KITS[(stage-1) % 3], mult = 1 + (stage-1)*0.12;
  const entries = kit.skills.map(id => ({ base: SK(id), mult }));
  return { st: bossStats(stage), emoji: BOSS_EMOJIS[(stage-1) % BOSS_EMOJIS.length], kit, entries, style: calcStyle(kit.fmc, entries) };
}
const contribMax = stage => 80 + stage*35;
const clearBonus = stage => 500 + stage*300;
const rangeLabel = mc => mc >= 0.7 ? '근접' : mc <= 0.3 ? '원거리' : '중거리';
function skillDesc(b) {
  const p = [];
  if (b.shape === 'zone') {
    if (b.heal) p.push(`${b.dur}초간 초당 최대 체력 ${Math.round(b.heal*100)}% 회복`);
    else p.push(`${b.dur}초간 ${b.tick}초마다 ${b.tickDmg} 지속 피해`);
    if (b.zslow) p.push('둔화'); if (b.pull) p.push('끌어당김');
  } else if (b.shape === 'shower') p.push(`유성 ${b.n}발 · 각 ${b.dmg} 피해`);
  else if (b.shape === 'flurry') p.push(`${b.hits}연타 광역 피해`);
  else if (b.shape === 'buff') { p.push(`${b.dur}초간 공격력 +${Math.round((b.batk-1)*100)}%`); if (b.bspd > 1) p.push(`이동 +${Math.round((b.bspd-1)*100)}%`); if (b.bls) p.push(`${Math.round(b.bls*100)}% 흡혈`); }
  else if (b.shape === 'shield') p.push(`최대 체력 ${Math.round(b.pct*100)}% 보호막 (${b.dur}초)`);
  else if (b.shape === 'heal') p.push(`최대 체력 ${Math.round(b.fxv*100)}% 회복`);
  else if (b.shape === 'bind') p.push(`${b.fxv}초간 기절`);
  else if (b.n > 1) p.push(`${b.n}연발 · 발당 ${b.dmg} 피해`);
  else if (b.dmg) p.push(`피해 ${b.dmg}`);
  if (b.shape === 'rush') p.push('돌진 후 베기');
  if (b.shape === 'blink') p.push('적의 등 뒤로 순간이동');
  if (b.shape === 'strike' || b.shape === 'blast') p.push('범위 지정');
  if (b.fx === 'lifesteal') p.push(`${Math.round(b.fxv*100)}% 흡혈`);
  if (b.fx === 'freeze') p.push(`${b.fxv}초 둔화`);
  if (b.fx === 'poison') p.push('4초 중독');
  if (b.fx === 'stun') p.push(`${b.fxv}초 기절`);
  if (b.fx === 'pull') p.push(`끌어당김 · ${b.fxv}초 기절`);

}
let toastTimer;
function toast(msg) {

const icons = () => { try { lucide.createIcons(); } catch (e) {} };
let shownGold = state.gold, goldAnim = 0;
function setGold() {
  const el = $('goldText'), to = state.gold, from = shownGold;
  cancelAnimationFrame(goldAnim);
  if (from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - t0)/450);
    shownGold = from + (to - from)*(1 - Math.pow(1-p, 3)); el.textContent = fmt(shownGold);
    if (p < 1) goldAnim = requestAnimationFrame(tick); else shownGold = to;
  };
  goldAnim = requestAnimationFrame(tick);
}

function pullMulti(kind) {

  if (B.firstClear) chips.push(`<span class="bg-blue-50 text-blue-600 rounded-full px-2 py-0.5">첫 클리어 +${fmt(B.bonus)}</span>`);
  hr.classList.remove('hidden'); hr.classList.add('flex');
  hr.innerHTML = `<div class="w-full max-w-[330px] bg-white rounded-2xl p-3.5 text-center anim-pop">
    <div class="flex items-center justify-center gap-2.5"><span class="emoji text-3xl">${win ? '🏆' : '💀'}</span><div class="text-left"><div class="text-base font-extrabold ${win ? 'text-blue-600' : 'text-rose-500'}">${win ? '승리!' : (B.timeout ? '시간 초과' : '패배')}</div><div class="text-[11px] text-slate-500">STAGE ${B.stage} · 피해 ${fmt(st.dealt)} · 회피 ${st.dodges}회</div></div></div>
    <div class="mt-2 flex items-center justify-center gap-1 flex-wrap text-[11px] font-bold">${chips.join('')}</div>
    <div class="grid ${o.alt ? 'grid-cols-2' : 'grid-cols-1'} gap-2 mt-3">
      <button onclick="pickNext('def')" class="press relative overflow-hidden rounded-xl bg-blue-600 text-white font-bold py-2.5 text-[12px]"><div id="rbBar" class="absolute inset-y-0 left-0 bg-white/25" style="width:0%"></div><span class="relative">${o.def.label} <span id="rbSec" class="opacity-80">3</span></span></button>
      ${o.alt ? `<button onclick="pickNext('alt')" class="press rounded-xl bg-slate-100 text-slate-700 font-bold py-2.5 text-[12px]">${o.alt.label}</button>` : ''}
    </div></div>`;
}
function pickNext(which) {
  if (!B || !B.opts || B.resolved) return;
  B.resolved = true;
  const o = B.opts[which] || B.opts.def;
  state.sel = clamp(o.stage, 1, state.stage); save();
  startBattle();
  if (tab === 'fight') render();
}

/* ===================== 시작 ===================== */
(function initSplash() {
  const title = $('splashTitle');
  title.innerHTML = 'Animal Brawl'.split('').map((ch, i) => ch === ' ' ? '<span style="width:12px"></span>' : `<span style="display:inline-block;opacity:0;animation:letterIn .6s cubic-bezier(.2,1.3,.4,1) ${0.08*i}s both">${ch}</span>`).join('');
  requestAnimationFrame(() => { $('splashBar').style.width = '100%'; });
  const minWait = new Promise(r => setTimeout(r, 1700));
  const fontsReady = Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 2500))]);
  Promise.all([minWait, fontsReady]).then(() => {
    const sp = $('splash'); sp.classList.add('anim-fadeout');
    setTimeout(() => sp.remove(), 480);
  });
})();
render(true);
startBattle();
requestAnimationFrame(loop);
</script>
