    <!DOCTYPE html>
    <html lang="ko">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Animal Brawl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
    html, body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: #e9ecef; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    body { user-select: none; -webkit-user-select: none; }
    .emoji { font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
    .tier-n { background: linear-gradient(135deg,#e5e7eb,#9ca3af); }
    .tier-r { background: linear-gradient(135deg,#bfdbfe,#3b82f6); }
    .tier-e { background: linear-gradient(135deg,#ddd6fe,#8b5cf6); }
    .tier-m { background: linear-gradient(135deg,#fecdd3,#f43f5e 60%,#fb923c); }
    .tier-l { background: linear-gradient(135deg,#fef08a,#f59e0b 60%,#ea580c); }
    .tier-t { background: linear-gradient(120deg,#ff6b6b,#feca57,#48dbfb,#a29bfe,#ff6b6b); background-size: 300% 300%; animation: rainbow 3s linear infinite; }
    @keyframes rainbow { 0%{background-position:0% 50%} 100%{background-position:300% 50%} }
    .tier-text-n{color:#6b7280}.tier-text-r{color:#2563eb}.tier-text-e{color:#7c3aed}.tier-text-m{color:#e11d48}.tier-text-l{color:#d97706}.tier-text-t{color:#db2777}
    @keyframes shake { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-14deg) scale(1.05)} 40%{transform:rotate(14deg) scale(1.1)} 60%{transform:rotate(-10deg) scale(1.1)} 80%{transform:rotate(10deg) scale(1.05)} }
    @keyframes popIn { 0%{transform:scale(.2) rotate(-12deg);opacity:0} 60%{transform:scale(1.12) rotate(3deg);opacity:1} 100%{transform:scale(1) rotate(0)} }
    @keyframes bounceY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes fadeOut { from{opacity:1} to{opacity:0} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes slideUp { from{transform:translateY(18px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes glow { 0%,100%{box-shadow:0 0 18px 2px rgba(255,255,255,.4)} 50%{box-shadow:0 0 44px 10px rgba(255,255,255,.85)} }
    @keyframes flipIn { 0%{transform:perspective(500px) rotateY(90deg) scale(.7);opacity:0} 100%{transform:none;opacity:1} }
    @keyframes slotPop { 0%{transform:scale(.8)} 60%{transform:scale(1.08)} 100%{transform:scale(1)} }
    @keyframes pulseRing { 0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.45)} 50%{box-shadow:0 0 0 7px rgba(59,130,246,0)} }
    @keyframes boxGlow { 0%,100%{filter:drop-shadow(0 0 8px var(--gc))} 50%{filter:drop-shadow(0 0 28px var(--gc))} }
    .anim-shake { animation: shake .7s ease-in-out; }
    .anim-pop { animation: popIn .6s cubic-bezier(.2,1.3,.4,1) both; }
    .anim-bounce { animation: bounceY 1.4s ease-in-out infinite; }
    .anim-fade { animation: fadeIn .25s ease both; }
    .anim-fadeout { animation: fadeOut .2s ease both; }
    .anim-slide { animation: slideUp .35s cubic-bezier(.2,.8,.2,1) both; }
    .anim-glow { animation: glow 1.6s ease-in-out infinite; }
    .reveal { animation: flipIn .5s cubic-bezier(.2,1.2,.4,1) both; }
    .slot-pop { animation: slotPop .38s cubic-bezier(.2,1.4,.4,1); }
    .sel-pulse { animation: pulseRing 1.6s ease-in-out infinite; }
    .box-glow { animation: boxGlow 1.1s ease-in-out infinite; }
    .rays { position:absolute; inset:-40%; background: repeating-conic-gradient(rgba(255,255,255,.35) 0 8deg, transparent 8deg 24deg); animation: spin 8s linear infinite; border-radius:50%; }
    .press { transition: transform .12s ease, filter .12s ease; }
    .press:active { transform: scale(.96); filter: brightness(.96); }
    .card-shadow { box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 20px rgba(15,23,42,.05); }
    #battle canvas { display:block; touch-action:none; }
    #toast { transition: opacity .2s ease, transform .2s ease; }
    </style>
    </head>
    <body class="text-slate-800">

    <div id="app" class="relative mx-auto w-full max-w-[480px] min-h-screen bg-[#f2f4f6] shadow-xl">
    <header class="sticky top-0 z-20 bg-[#f2f4f6]/90 backdrop-blur px-5 pt-4 pb-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
        <span class="emoji text-2xl">🐾</span>
        <h1 class="text-xl font-extrabold tracking-tight">Animal Brawl</h1>
        </div>
        <div class="flex items-center gap-1.5 bg-white rounded-full pl-3 pr-4 py-2 card-shadow">
        <span class="emoji text-sm">🪙</span>
        <span id="goldText" class="font-extrabold tabular-nums text-[15px]">0</span>
        </div>
    </header>
    <main id="view" class="px-4 pb-28"></main>
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-30 bg-white/95 backdrop-blur border-t border-slate-100 rounded-t-3xl shadow-[0_-4px_24px_rgba(0,0,0,.06)] px-3 pt-2 pb-[max(8px,env(safe-area-inset-bottom))]">
        <div class="grid grid-cols-4 gap-1" id="navBar"></div>
    </nav>
    </div>

    <div id="gachaModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm px-5 overflow-y-auto"></div>
    <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 px-6"></div>
    <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-28 z-[70] opacity-0 pointer-events-none bg-slate-900/90 text-white text-sm font-medium rounded-2xl px-5 py-3 max-w-[90%] text-center"></div>

    <!-- 전투 오버레이 (기기 방향 그대로, 전체 화면) -->
    <div id="battle" class="fixed inset-0 z-[60] hidden bg-black overflow-hidden">
    <canvas id="cv"></canvas>
    <div id="hud" class="absolute inset-0 pointer-events-none flex flex-col justify-between"
        style="padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))">
        <div class="flex items-start gap-2">
        <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5 mb-1">
            <span id="hudMeName" class="text-white text-[13px] font-extrabold truncate drop-shadow"></span>
            <span id="hudMeStyle" class="shrink-0 text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-white/15 text-white/85"></span>
            </div>
            <div class="relative h-2.5 rounded-full bg-black/40 overflow-hidden ring-1 ring-white/20">
            <div id="hudMeLag" class="absolute inset-y-0 left-0 bg-white/70"></div>
            <div id="hudMeBar" class="absolute inset-y-0 left-0"></div>
            </div>
            <div id="hudMeHp" class="text-[10px] text-white/75 mt-0.5 tabular-nums"></div>
        </div>
        <div class="shrink-0 text-center bg-black/40 backdrop-blur rounded-2xl px-3 py-1.5 ring-1 ring-white/15">
            <div class="text-[10px] font-bold text-white/60 leading-none">STAGE</div>
            <div id="hudStage" class="text-white text-lg font-extrabold leading-tight">1</div>
            <div id="hudTime" class="text-[10px] text-white/70 tabular-nums leading-none">0s</div>
        </div>
        <div class="flex-1 min-w-0 text-right">
            <div class="flex items-center justify-end gap-1.5 mb-1">
            <span id="hudEnStyle" class="shrink-0 text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-white/15 text-white/85"></span>
            <span id="hudEnName" class="text-white text-[13px] font-extrabold truncate drop-shadow"></span>
            </div>
            <div class="relative h-2.5 rounded-full bg-black/40 overflow-hidden ring-1 ring-white/20">
            <div id="hudEnLag" class="absolute inset-y-0 right-0 bg-white/70"></div>
            <div id="hudEnBar" class="absolute inset-y-0 right-0 bg-gradient-to-l from-rose-500 to-orange-400"></div>
            </div>
            <div id="hudEnHp" class="text-[10px] text-white/75 mt-0.5 tabular-nums"></div>
        </div>
        </div>
        <div class="flex items-end justify-between">
        <div id="hudSkills" class="flex gap-2"></div>
        <div class="flex gap-2 pointer-events-auto">
            <button id="btnSpeed" class="press bg-black/45 backdrop-blur ring-1 ring-white/20 text-white text-xs font-bold rounded-full px-3.5 py-2">1x</button>
            <button id="btnFlee" class="press bg-white/90 text-rose-600 text-xs font-bold rounded-full px-3.5 py-2">도망치기</button>
        </div>
        </div>
    </div>
    <div id="resultBox" class="absolute inset-0 hidden items-center justify-center bg-black/55 backdrop-blur-sm px-5"></div>
    </div>

    <script>
    /* ===================== 데이터 ===================== */
    const TIERS = [
    { k:'n', name:'일반', p:60,  m:1.0 },
    { k:'r', name:'희귀', p:25,  m:1.3 },
    { k:'e', name:'영웅', p:10,  m:1.7 },
    { k:'m', name:'신화', p:4,   m:2.2 },
    { k:'l', name:'전설', p:0.9, m:3.0 },
    { k:'t', name:'초월', p:0.1, m:5.0 },
    ];
    const TIER_IDX = Object.fromEntries(TIERS.map((t,i)=>[t.k,i]));
    const TIER_COLOR = { n:'#9ca3af', r:'#3b82f6', e:'#8b5cf6', m:'#f43f5e', l:'#f59e0b', t:'#ec4899' };

    // mc: 근접 성향 (0 = 원거리, 1 = 근접)
    const FIGHTERS = [
    { id:'dog',    emoji:'🐶', name:'멍멍이',   hp:120, atk:18, def:4, spd:100, mc:0.60 },
    { id:'fox',    emoji:'🦊', name:'날쌘여우', hp:100, atk:22, def:3, spd:120, mc:0.50 },
    { id:'bear',   emoji:'🐻', name:'불곰',     hp:200, atk:17, def:8, spd:70,  mc:0.90 },
    { id:'tiger',  emoji:'🐯', name:'호랑이',   hp:150, atk:26, def:5, spd:110, mc:0.85 },
    { id:'wolf',   emoji:'🐺', name:'늑대',     hp:130, atk:24, def:4, spd:115, mc:0.65 },
    { id:'lion',   emoji:'🦁', name:'사자왕',   hp:170, atk:25, def:7, spd:95,  mc:0.80 },
    { id:'rabbit', emoji:'🐰', name:'토깽이',   hp:90,  atk:15, def:2, spd:140, mc:0.35 },
    { id:'panda',  emoji:'🐼', name:'판다',     hp:180, atk:18, def:9, spd:75,  mc:0.75 },
    { id:'frog',   emoji:'🐸', name:'개굴맨',   hp:95,  atk:16, def:3, spd:105, mc:0.30 },
    { id:'dragon', emoji:'🐲', name:'아기용',   hp:160, atk:28, def:6, spd:100, mc:0.50 },
    ];
    // shape: proj(투사체) / bite(근접 베기) / strike(낙뢰) / blast(폭발) / spin(회전) / heal
    const SKILLS = [
    { id:'fire',   emoji:'🔥', name:'화염구', dmg:34, cd:4, fx:null,        fxv:0,    mc:0.20, range:330, shape:'proj',   wind:0.38, speed:430, color:'255,140,50' },
    { id:'vamp',   emoji:'🩸', name:'흡혈',   dmg:26, cd:5, fx:'lifesteal', fxv:0.8,  mc:1.00, range:90,  shape:'bite',   wind:0.22, kb:200,    color:'235,60,80' },
    { id:'bolt',   emoji:'⚡', name:'번개',   dmg:44, cd:6, fx:null,        fxv:0,    mc:0.10, range:360, shape:'strike', wind:0.48, radius:42, kb:140, color:'170,200,255' },
    { id:'ice',    emoji:'❄️', name:'얼음창', dmg:26, cd:5, fx:'freeze',    fxv:2.5,  mc:0.30, range:310, shape:'proj',   wind:0.32, speed:540, color:'130,220,255' },
    { id:'heal',   emoji:'💚', name:'치유',   dmg:0,  cd:8, fx:'heal',      fxv:0.12, mc:0.50, range:0,   shape:'heal',   wind:0.55, color:'90,230,150' },
    { id:'bomb',   emoji:'💥', name:'폭발',   dmg:70, cd:9, fx:null,        fxv:0,    mc:0.75, range:170, shape:'blast',  wind:0.75, radius:82, kb:480, color:'255,120,60' },
    { id:'wind',   emoji:'🌪️', name:'회오리', dmg:22, cd:3, fx:null,        fxv:0,    mc:0.95, range:95,  shape:'spin',   wind:0.30, radius:88, kb:420, color:'170,230,230' },
    { id:'poison', emoji:'☠️', name:'맹독',   dmg:12, cd:6, fx:'poison',    fxv:7,    mc:0.25, range:300, shape:'proj',   wind:0.35, speed:360, color:'150,230,90' },
    ];
    const BOSS_EMOJIS = ['👹','👺','🐊','🦖','🦂','🐙','🦈','🐉','👾','🧌'];
    const BOSS_KITS = [
    { fmc:0.95, skills:['wind','vamp','bomb'] },
    { fmc:0.15, skills:['fire','ice','bolt'] },
    { fmc:0.50, skills:['poison','bomb','wind'] },
    ];

    const FIGHTER_COST = 1000, SKILL_COST = 500, INIT_GOLD = 15000;
    const SAVE_KEY = 'animal-brawl-save-v1';

    /* ===================== 상태 ===================== */
    function freshState() { return { gold: INIT_GOLD, stage: 1, inv: [], eq: { f: null, s: [null,null,null] }, nextUid: 1 }; }
    let state = load();
    let tab = 'gacha', invTab = 'f', flashSlot = null;
    let sel = { type: 'skill', idx: 0 };
    function load() {
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const s = JSON.parse(raw); if (s && s.eq && Array.isArray(s.inv)) return s; } } catch (e) {}
    return freshState();
    }
    function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }

    /* ===================== 유틸 ===================== */
    const $ = id => document.getElementById(id);
    const fmt = n => Math.round(n).toLocaleString('ko-KR');
    const tierOf = k => TIERS[TIER_IDX[k]];
    function rollTier(min) {
    const list = TIERS.filter((t,i) => i >= (min||0));
    const total = list.reduce((a,t) => a + t.p, 0);
    let r = Math.random() * total, acc = 0;
    for (const t of list) { acc += t.p; if (r < acc) return t.k; }
    return list[0].k;
    }
    const getItem = uid => state.inv.find(i => i.uid === uid) || null;
    const fighterBase = it => FIGHTERS.find(f => f.id === it.id);
    const skillBase = it => SKILLS.find(s => s.id === it.id);
    function fighterStats(it) {
    const b = fighterBase(it), m = tierOf(it.tier).m;
    return { hp: Math.round(b.hp*m), atk: Math.round(b.atk*m), def: Math.round(b.def*m), spd: Math.round(b.spd*m) };
    }
    function powerOf(st, entries) {
    let p = st.hp/5 + st.atk*3 + st.def*3 + Math.min(st.spd,220)/2;
    for (const en of entries) { const b = en.base; p += (b.dmg*en.mult)/b.cd*2 + (b.fx==='heal' ? 15*en.mult : 0); }
    return Math.round(p);
    }
    const equippedSkills = () => state.eq.s.map(getItem).filter(Boolean);
    const skillEntries = () => equippedSkills().map(si => ({ base: skillBase(si), mult: tierOf(si.tier).m }));
    function myPower() { const f = getItem(state.eq.f); return f ? powerOf(fighterStats(f), skillEntries()) : 0; }

    // 근접 성향 → 전투 성향
    function calcStyle(fmc, entries) {
    let sum = fmc, w = 1;
    for (const en of entries) { if (en.base.fx === 'heal') continue; sum += en.base.mc; w += 1; }
    const c = sum / w;
    const label = c < 0.3 ? '원거리 저격형' : c < 0.5 ? '견제형' : c < 0.7 ? '균형형' : '돌격형';
    const desc = c < 0.3 ? '거리를 벌리고 저격하며, 접근하면 이탈해요'
                : c < 0.5 ? '안전거리에서 견제하고 틈을 노려요'
                : c < 0.7 ? '상황에 따라 거리를 조절해 교전해요'
                : '돌진해 근접전을 벌이고 후딜을 노려요';
    return { c, aggr: 0.2 + 0.8*c, pref: 250 + (62-250)*c, label, desc };
    }
    function myStyle() { const f = getItem(state.eq.f); return f ? calcStyle(fighterBase(f).mc, skillEntries()) : null; }
    function bossStats(stage) {
    const s = stage - 1;
    return { hp: Math.round(170*(1+0.36*s)*(1+0.008*s*s)), atk: Math.round(13+s*3.6), def: Math.round(2+s*1.5), spd: Math.min(140, 85+Math.round(stage*2.5)) };
    }
    function bossInfo(stage) {
    const kit = BOSS_KITS[(stage-1) % 3], mult = 1 + (stage-1)*0.12;
    const entries = kit.skills.map(id => ({ base: SKILLS.find(s => s.id === id), mult }));
    return { st: bossStats(stage), emoji: BOSS_EMOJIS[(stage-1) % BOSS_EMOJIS.length], kit, entries, style: calcStyle(kit.fmc, entries) };
    }
    const rangeLabel = mc => mc >= 0.7 ? '근접' : mc <= 0.3 ? '원거리' : '중거리';
    function skillDesc(sb) {
    let d = sb.dmg ? `피해 ${sb.dmg}` : '';
    if (sb.fx === 'lifesteal') d += ` · ${Math.round(sb.fxv*100)}% 흡혈`;
    if (sb.fx === 'freeze') d += ` · ${sb.fxv}초 둔화`;
    if (sb.fx === 'poison') d += ` · 4초 중독`;
    if (sb.fx === 'heal') d += `최대 체력 ${Math.round(sb.fxv*100)}% 회복`;
    if (sb.shape === 'blast' || sb.shape === 'strike') d += ' · 범위 지정';
    return d + ` · 쿨 ${sb.cd}초`;
    }
    let toastTimer;
    function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.style.opacity = 1; t.style.transform = 'translate(-50%,0)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.opacity = 0; t.style.transform = 'translate(-50%,8px)'; }, 1800);
    }
    const icons = () => { try { lucide.createIcons(); } catch (e) {} };

    let shownGold = state.gold, goldAnim = 0;
    function setGold() {
    const el = $('goldText'), to = state.gold, from = shownGold;
    cancelAnimationFrame(goldAnim);
    if (from === to) { el.textContent = fmt(to); return; }
    const t0 = performance.now();
    const tick = now => {
        const p = Math.min(1, (now - t0)/450);
        shownGold = from + (to - from)*(1 - Math.pow(1-p, 3));
        el.textContent = fmt(shownGold);
        if (p < 1) goldAnim = requestAnimationFrame(tick); else shownGold = to;
    };
    goldAnim = requestAnimationFrame(tick);
    }

    /* ===================== 렌더링 ===================== */
    const TABS = [
    { id:'gacha', label:'영입', icon:'gift' }, { id:'lineup', label:'세팅', icon:'users' },
    { id:'fight', label:'전투', icon:'swords' }, { id:'settings', label:'설정', icon:'settings' },
    ];
    function renderNav() {
    $('navBar').innerHTML = TABS.map(t => `
        <button onclick="setTab('${t.id}')" class="press flex flex-col items-center gap-1 py-2 rounded-2xl transition-colors ${tab===t.id?'text-blue-600 bg-blue-50':'text-slate-400'}">
        <i data-lucide="${t.icon}" class="w-[22px] h-[22px]" ${tab===t.id?'stroke-width="2.5"':''}></i>
        <span class="text-[11px] font-bold">${t.label}</span>
        </button>`).join('');
    }
    function setTab(t) { tab = t; render(true); window.scrollTo({ top: 0 }); }
    function render(animate) {
    setGold(); renderNav();
    const v = $('view');
    v.innerHTML = tab === 'gacha' ? viewGacha() : tab === 'lineup' ? viewLineup() : tab === 'fight' ? viewFight() : viewSettings();
    if (animate && v.firstElementChild) v.firstElementChild.classList.add('anim-slide');
    flashSlot = null;
    icons();
    }

    /* ---- 영입 ---- */
    function gachaCard(kind, title, sub, emoji, grad, shadow) {
    const c1 = kind === 'f' ? FIGHTER_COST : SKILL_COST;
    return `<div class="rounded-3xl bg-gradient-to-br ${grad} text-white p-5 shadow-lg ${shadow}">
        <div class="flex items-center gap-4">
        <div class="emoji text-5xl anim-bounce">${emoji}</div>
        <div><div class="font-extrabold text-lg leading-tight">${title}</div><div class="text-xs text-white/80 mt-0.5">${sub}</div></div>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-4">
        <button onclick="pull('${kind}')" class="press rounded-2xl bg-white/20 backdrop-blur py-3 text-center">
            <div class="text-[11px] font-bold text-white/80">1회</div>
            <div class="font-extrabold flex items-center justify-center gap-1"><span class="emoji text-sm">🪙</span>${fmt(c1)}</div>
        </button>
        <button onclick="pullMulti('${kind}')" class="press rounded-2xl bg-white text-slate-900 py-3 text-center shadow">
            <div class="text-[11px] font-bold text-slate-500">10회 · 희귀 이상 1개 보장</div>
            <div class="font-extrabold flex items-center justify-center gap-1"><span class="emoji text-sm">🪙</span>${fmt(c1*10)}</div>
        </button>

    let pulling = false;

    function itemInfo(it) {

    state.gold -= cost;

    let multiTimers = [];

        <div class="text-2xl font-extrabold ${win ? 'text-blue-600' : 'text-rose-500'}">${win ? '승리!' : (B.timeout ? '시간 초과' : '패배')}</div>
        <div class="text-sm text-slate-500 mt-1.5">${win ? `스테이지 ${B.stage} 클리어 → <b>스테이지 ${B.stage+1}</b>` : '보상이 없어요. 구성을 바꿔 다시 도전해보세요!'}</div>
        ${win ? `<div class="mt-3 inline-flex items-center gap-1 bg-amber-50 text-amber-600 font-extrabold rounded-full px-4 py-2"><span class="emoji">🪙</span>+${fmt(B.reward)}</div>` : ''}
        <div class="grid grid-cols-4 gap-2 mt-4">${stat('가한 피해', fmt(st.dealt))}${stat('받은 피해', fmt(st.taken))}${stat('회피', st.dodges + '회')}${stat('시간', Math.floor(B.fightT) + 's')}</div>
        <button onclick="closeBattle()" class="press mt-5 w-full rounded-2xl bg-blue-600 text-white font-bold py-3.5">확인</button>
    </div>`;
    }
    function closeBattle() {
    if (B) cancelAnimationFrame(B.raf);
    B = null;
    $('battle').classList.add('hidden');
    leaveFullscreen();
    render();
    }

    /* ===================== 시작 ===================== */
    render(true);
    </script>
    </body>
    </html>
