<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6">
<title>Animal Brawl</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg:#f2f4f6; --card:#fff; --ink:#191f28; --ink2:#4e5968; --ink3:#8b95a1; --ink4:#b0b8c1; --line:#e8ebee;
    --blue:#3182f6; --blue-d:#1b64da; --blue-s:#e8f3ff; --red:#f04452; --red-s:#ffeceb; --green:#03b26c; --gold:#f2a50c;
  }
  * { box-sizing: border-box; }
  html, body { font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif; background:#dde1e6; color:var(--ink); -webkit-tap-highlight-color:transparent; overscroll-behavior:none; letter-spacing:-0.012em; }
  body { user-select:none; -webkit-user-select:none; font-feature-settings:'tnum' 1; }
  button { font-family:inherit; letter-spacing:inherit; }
  .emoji { font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; letter-spacing:0; }
  #app { background:var(--bg); }

  /* ───────── 등급 팔레트 ───────── */
  .t-n { --t:#7b8794; --ts:#eef1f4; --tm:#d5dae0; --tg:rgba(123,135,148,.25); }
  .t-r { --t:#2f7cf0; --ts:#e6f1ff; --tm:#a9cbfa; --tg:rgba(47,124,240,.28); }
  .t-e { --t:#7a4de0; --ts:#f0eaff; --tm:#c8b5f5; --tg:rgba(122,77,224,.30); }
  .t-m { --t:#e5424e; --ts:#ffebed; --tm:#f5adb2; --tg:rgba(229,66,78,.32); }
  .t-l { --t:#e98a00; --ts:#fff2d6; --tm:#f4cc80; --tg:rgba(233,138,0,.36); }
  .t-t { --t:#c93fb0; --ts:#fdeaf8; --tm:#eba5dc; --tg:rgba(201,63,176,.40); }
  .tc { color:var(--t); }
  .chip { display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 9px; border-radius:99px; font-size:11px; font-weight:700; background:var(--ts); color:var(--t); }
  .chip.neutral { background:#f2f4f6; color:var(--ink2); }
  .chip.dark { background:rgba(255,255,255,.14); color:#fff; }

  /* 메달(캐릭터 받침) */
  .medal { display:flex; align-items:center; justify-content:center; border-radius:50%; position:relative;
    background:radial-gradient(circle at 50% 30%, #fff 0, var(--ts) 55%, var(--tm) 130%); box-shadow:inset 0 0 0 1.5px var(--tm), 0 6px 14px -6px var(--tg); }
  .medal > span { filter:drop-shadow(0 3px 3px rgba(25,31,40,.22)); line-height:1; }

  /* 타일 */
  .tile { position:relative; border-radius:18px; background:linear-gradient(180deg,var(--ts) 0,#fff 78%); box-shadow:inset 0 0 0 1.5px var(--tm); transition:transform .14s ease, box-shadow .14s ease; }
  .tile.eq { box-shadow:inset 0 0 0 2px var(--ink); }
  .tile.sel { box-shadow:inset 0 0 0 2.5px var(--blue), 0 0 0 4px rgba(49,130,246,.18); }
  .tile.locked { background:#f2f4f6; box-shadow:inset 0 0 0 1.5px #e5e8eb; }
  .tile.hi-m, .tile.hi-l { box-shadow:inset 0 0 0 1.5px var(--tm), 0 8px 18px -10px var(--t); }
  .holo { position:relative; }
  .holo::before { content:''; position:absolute; inset:0; border-radius:inherit; padding:2px; pointer-events:none;
    background:conic-gradient(#ff7eb3,#ffd86b,#6bf0c4,#6bb7ff,#c58bff,#ff7eb3);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; animation:hue 5s linear infinite; }
  @keyframes hue { to { filter:hue-rotate(360deg); } }

  /* 카드/버튼 */
  .card { background:var(--card); border-radius:24px; padding:20px; }
  .soft { box-shadow:0 1px 0 rgba(25,31,40,.03), 0 10px 28px -16px rgba(25,31,40,.18); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:48px; padding:0 18px; border-radius:16px; font-weight:700; font-size:15px; border:0; cursor:pointer; transition:transform .12s ease, background .15s ease, opacity .15s; }
  .btn:active { transform:scale(.97); }
  .btn.primary { background:var(--blue); color:#fff; }
  .btn.primary:active { background:var(--blue-d); }
  .btn.ghost { background:#f2f4f6; color:var(--ink2); }
  .btn.danger { background:var(--red-s); color:var(--red); }
  .btn.sm { height:36px; padding:0 14px; font-size:13px; border-radius:12px; }
  .btn:disabled { opacity:.4; }
  .press { transition:transform .12s ease; }
  .press:active { transform:scale(.96); }
  .bar { height:6px; border-radius:99px; background:#eceff2; overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:99px; background:var(--blue); transition:width .4s cubic-bezier(.2,.8,.2,1); }
  .coin { width:1.05em; height:1.05em; flex:none; vertical-align:-0.16em; }
  .seg { display:flex; padding:4px; border-radius:16px; background:#eceff2; }
  .seg button { flex:1; height:38px; border-radius:12px; font-weight:700; font-size:14px; color:var(--ink3); border:0; background:transparent; transition:all .18s; }
  .seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(25,31,40,.12); }
  .sect { font-size:13px; font-weight:700; color:var(--ink3); margin-bottom:10px; letter-spacing:0; }

  /* 네비게이션 */
  .navbtn { position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 0 8px; color:var(--ink4); font-size:11px; font-weight:700; border:0; background:none; transition:color .18s; }
  .navbtn.on { color:var(--ink); }
  .navbtn.on::before { content:''; position:absolute; top:0; left:50%; width:22px; height:3px; margin-left:-11px; border-radius:0 0 4px 4px; background:var(--blue); }
  .navbtn.on i, .navbtn.on svg { color:var(--blue); }

  /* 애니메이션 */
  @keyframes popIn { 0% { transform:scale(.55) translateY(14px); opacity:0; } 60% { transform:scale(1.04); opacity:1; } 100% { transform:none; } }
  @keyframes slideUp { from { transform:translateY(14px); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeOut { from { opacity:1; } to { opacity:0; } }
  @keyframes flipIn { 0% { transform:perspective(500px) rotateY(80deg) scale(.7); opacity:0; } 100% { transform:none; opacity:1; } }
  @keyframes shakeOrb { 0%,100% { transform:rotate(0); } 15% { transform:rotate(-12deg) translateY(-4px); } 30% { transform:rotate(11deg); } 45% { transform:rotate(-9deg) translateY(-3px); } 60% { transform:rotate(8deg); } 75% { transform:rotate(-5deg); } }
  @keyframes burst { 0% { transform:scale(.2); opacity:.95; } 100% { transform:scale(3.2); opacity:0; } }
  @keyframes rise { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(49,130,246,.35); } 50% { box-shadow:0 0 0 7px rgba(49,130,246,0); } }
  @keyframes spinSlow { to { transform:rotate(360deg); } }
  @keyframes loadBar { from { width:0%; } to { width:100%; } }
  @keyframes letterIn { 0% { transform:translateY(18px); opacity:0; } 100% { transform:none; opacity:1; } }
  @keyframes lvUp { 0% { transform:scale(.6); opacity:0; } 60% { transform:scale(1.12); opacity:1; } 100% { transform:scale(1); } }
  .a-pop { animation:popIn .55s cubic-bezier(.2,1.2,.4,1) both; }
  .a-slide { animation:slideUp .38s cubic-bezier(.2,.8,.2,1) backwards; }
  .a-fade { animation:fadeIn .25s ease backwards; }
  .a-out { animation:fadeOut .45s ease both; }
  .a-flip { animation:flipIn .5s cubic-bezier(.2,1.2,.4,1) both; }
  .a-pulse { animation:pulse 1.7s ease-in-out infinite; }
  .a-lvup { animation:lvUp .5s cubic-bezier(.2,1.4,.4,1) both; }
  .a-float { animation:rise 2.6s ease-in-out infinite; }

  /* 가챠 오브 */
  .orb { width:132px; height:132px; border-radius:50%; position:relative; background:radial-gradient(circle at 34% 28%, #fff 0, #e3e8ee 32%, #9ba7b5 100%); box-shadow:0 26px 40px -14px rgba(0,0,0,.65), inset -10px -12px 22px rgba(0,0,0,.18); animation:shakeOrb .85s ease-in-out; }
  .orb::before { content:''; position:absolute; left:2px; right:2px; top:50%; height:5px; margin-top:-2px; background:rgba(25,31,40,.22); }
  .orb::after { content:''; position:absolute; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:#fff; box-shadow:0 0 0 5px rgba(25,31,40,.2), 0 0 20px 4px var(--og,rgba(255,255,255,.7)); }
  .burst { position:absolute; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle, #fff 0, var(--og,#fff) 38%, transparent 70%); animation:burst .7s ease-out both; }
  .rays { position:absolute; inset:-60%; background:repeating-conic-gradient(var(--tg) 0 7deg, transparent 7deg 22deg); animation:spinSlow 14s linear infinite; border-radius:50%; mask-image:radial-gradient(circle, #000 25%, transparent 68%); -webkit-mask-image:radial-gradient(circle, #000 25%, transparent 68%); }

  /* 아레나 */
  .arena { position:relative; width:100%; border-radius:24px; overflow:hidden; background:#0e1512; box-shadow:0 14px 30px -18px rgba(14,21,18,.7); }
  .arena-box { position:relative; width:100%; aspect-ratio:720/500; container-type:inline-size; margin:0 auto; }
  .arena.fs, .arena:fullscreen { position:fixed; inset:0; z-index:90; width:100vw; height:100dvh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#000; box-shadow:none; }
  .arena.fs .arena-box, .arena:fullscreen .arena-box { width:min(100vw, calc(100dvh * 1.44)); }
  @media (orientation:portrait) {
    .arena.fs .arena-box, .arena:fullscreen .arena-box { width:min(100dvh, calc(100vw * 1.44)); transform:rotate(90deg); flex:none; }
  }
  .hud { position:absolute; inset:0; pointer-events:none; padding:2.4cqw 2.6cqw; display:flex; flex-direction:column; justify-content:space-between; font-size:clamp(9px,1.95cqw,16px); }
  .hud .row { display:flex; align-items:flex-start; gap:1.4em; }
  .plate { flex:1; min-width:0; display:flex; align-items:center; gap:.7em; }
  .plate.r { flex-direction:row-reverse; text-align:right; }
  .avatar { width:3.3em; height:3.3em; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(9,14,12,.7); box-shadow:0 0 0 .2em var(--team), 0 4px 10px rgba(0,0,0,.4); }
  .avatar span { font-size:1.75em; line-height:1; }
  .pinfo { flex:1; min-width:0; }
  .pname { display:flex; align-items:baseline; gap:.5em; color:#fff; font-weight:800; font-size:1.08em; text-shadow:0 1px 3px rgba(0,0,0,.7); white-space:nowrap; }
  .plate.r .pname { flex-direction:row-reverse; }
  .pname small { font-size:.78em; font-weight:700; color:rgba(255,255,255,.66); overflow:hidden; text-overflow:ellipsis; }
  .hpbar { position:relative; height:.95em; margin-top:.3em; border-radius:99px; background:rgba(0,0,0,.55); overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
  .hpbar i { position:absolute; top:0; bottom:0; }
  .plate .hpnum { color:rgba(255,255,255,.78); font-size:.8em; font-weight:600; margin-top:.2em; }
  .pill { background:rgba(9,14,12,.66); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-radius:99px; padding:.4em 1.1em; color:#fff; text-align:center; line-height:1.2; flex:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); }
  .pill b { display:block; font-size:1.25em; font-weight:800; }
  .pill small { font-size:.8em; font-weight:600; color:rgba(255,255,255,.65); }
  .sks { position:relative; width:3.4em; height:3.4em; border-radius:.9em; background:rgba(9,14,12,.7); display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,.18); }
  .sks span.e { font-size:1.65em; line-height:1; }
  .sks .cd { position:absolute; inset:0; }
  .sks .n { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:1.1em; text-shadow:0 1px 3px #000; }
  .hbtn { pointer-events:auto; width:2.9em; height:2.9em; border-radius:50%; border:0; display:flex; align-items:center; justify-content:center; background:rgba(9,14,12,.66); color:#fff; font-weight:800; font-size:.95em; box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); cursor:pointer; }
  .hbtn:active { transform:scale(.92); }
  .hbtn svg { width:1.35em; height:1.35em; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:4cqw; background:rgba(9,14,12,.74); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .overlay.on { display:flex; }
  .rcard { font-size:clamp(11px,2.2cqw,17px); width:min(25em,90%); background:#fff; color:var(--ink); border-radius:1.6em; padding:1.3em 1.4em 1.2em; box-shadow:0 20px 40px -12px rgba(0,0,0,.55); text-align:left; }
  .rbtn { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:.4em; height:3.1em; border-radius:1em; border:0; font-weight:800; font-size:1em; cursor:pointer; }
  .rbtn.p { background:var(--blue); color:#fff; }
  .rbtn.g { background:#eef1f4; color:var(--ink2); }
  .rbtn .fill { position:absolute; inset:0 auto 0 0; background:rgba(255,255,255,.28); width:0; }
  #toast { transition:opacity .2s ease, transform .2s ease; }
</style>
</head>
<body>

<!-- 로딩 -->
<div id="splash" style="position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#3182f6;">
  <div style="width:84px;height:84px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 34px -12px rgba(10,40,110,.55);animation:popIn .7s cubic-bezier(.2,1.2,.4,1) both;">
    <svg viewBox="0 0 48 48" width="52" height="52" fill="#3182f6"><ellipse cx="24" cy="31" rx="10.5" ry="8.6"/><ellipse cx="11.5" cy="22" rx="4.4" ry="5.6" transform="rotate(-16 11.5 22)"/><ellipse cx="19.2" cy="13.5" rx="4.4" ry="5.8" transform="rotate(-6 19.2 13.5)"/><ellipse cx="28.8" cy="13.5" rx="4.4" ry="5.8" transform="rotate(6 28.8 13.5)"/><ellipse cx="36.5" cy="22" rx="4.4" ry="5.6" transform="rotate(16 36.5 22)"/></svg>
  </div>
  <h1 id="splashTitle" style="margin:26px 0 0;font-size:36px;font-weight:800;color:#fff;letter-spacing:-0.03em;display:flex;"></h1>
  <div style="margin-top:6px;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:0;">방치형 자동 전투</div>
  <div style="margin-top:44px;width:176px;height:5px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;">
    <div style="height:100%;width:0;background:#fff;border-radius:99px;animation:loadBar 1.9s cubic-bezier(.45,.05,.25,1) .1s forwards;"></div>
  </div>
</div>

<div id="app" class="relative mx-auto w-full max-w-[480px] min-h-screen shadow-xl">
  <header class="sticky top-0 z-20 px-5 pt-4 pb-3 flex items-center justify-between" style="background:rgba(242,244,246,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);">
    <div class="flex items-center gap-2.5">
      <div style="width:30px;height:30px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 48 48" width="19" height="19" fill="#fff"><ellipse cx="24" cy="31" rx="10.5" ry="8.6"/><ellipse cx="11.5" cy="22" rx="4.4" ry="5.6" transform="rotate(-16 11.5 22)"/><ellipse cx="19.2" cy="13.5" rx="4.4" ry="5.8" transform="rotate(-6 19.2 13.5)"/><ellipse cx="28.8" cy="13.5" rx="4.4" ry="5.8" transform="rotate(6 28.8 13.5)"/><ellipse cx="36.5" cy="22" rx="4.4" ry="5.6" transform="rotate(16 36.5 22)"/></svg>
      </div>
      <h1 style="font-size:19px;font-weight:800;letter-spacing:-0.03em;">Animal Brawl</h1>
    </div>
    <div class="flex items-center gap-1.5" style="background:#fff;border-radius:99px;padding:7px 14px 7px 10px;box-shadow:0 1px 0 rgba(25,31,40,.03),0 6px 16px -10px rgba(25,31,40,.2);">
      <span id="coinIcon"></span>
      <span id="goldText" style="font-weight:800;font-size:15px;" class="tabular-nums">0</span>
    </div>
  </header>
  <main id="view" class="px-4 pb-28"></main>
  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-30" style="background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:0 8px max(6px,env(safe-area-inset-bottom));">
    <div class="grid grid-cols-4" id="navBar"></div>
  </nav>
</div>

<div id="gachaModal" class="fixed inset-0 z-[80] hidden items-center justify-center px-5 overflow-y-auto" style="background:rgba(8,12,20,.9);"></div>
<div id="confirmModal" class="fixed inset-0 z-[85] hidden items-center justify-center px-6" style="background:rgba(8,12,20,.55);"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-[95] opacity-0 pointer-events-none text-center" style="background:rgba(25,31,40,.92);color:#fff;font-size:14px;font-weight:600;border-radius:14px;padding:11px 18px;max-width:90%;"></div>

<script>
/* ===================== 데이터 ===================== */
const TIERS = [
  { k:'n', name:'일반', p:60,  m:1.0 },
  { k:'r', name:'희귀', p:25,  m:1.3 },
  { k:'e', name:'영웅', p:10,  m:1.7 },
  { k:'m', name:'신화', p:4,   m:2.2 },
  { k:'l', name:'전설', p:0.9, m:3.0 },
  { k:'t', name:'초월', p:0.1, m:5.0 },
];
const TIER_IDX = Object.fromEntries(TIERS.map((t,i)=>[t.k,i]));
const TIER_COLOR = { n:'#9ca3af', r:'#3b82f6', e:'#8b5cf6', m:'#f43f5e', l:'#f59e0b', t:'#ec4899' };

// 동물은 각자 고정 등급을 가짐. mc: 근접 성향(0=원거리, 1=근접), pas: 고유 특성
const FIGHTERS = [
  { id:'dog',     tier:'n', emoji:'🐶', name:'강아지',   hp:120, atk:18, def:4, spd:100, mc:0.60, pas:{ id:'dog',     name:'충성심',       desc:'체력 30% 이하에서 공격력 +30%, 이동속도 +15%' } },
  { id:'rabbit',  tier:'n', emoji:'🐰', name:'토끼',     hp:90,  atk:15, def:2, spd:140, mc:0.35, pas:{ id:'rabbit',  name:'날쌘 발',      desc:'회피 쿨타임 -35%, 회피 직후 0.8초간 이동속도 +30%' } },
  { id:'fox',     tier:'r', emoji:'🦊', name:'여우',     hp:100, atk:22, def:3, spd:120, mc:0.50, pas:{ id:'fox',     name:'교활한 반격',  desc:'공격을 회피하면 다음 공격 피해 +50%' } },
  { id:'frog',    tier:'r', emoji:'🐸', name:'개구리',   hp:95,  atk:16, def:3, spd:105, mc:0.30, pas:{ id:'frog',    name:'끈적한 피부',  desc:'피격 시 20% 확률로 공격자를 1.5초 둔화' } },
  { id:'wolf',    tier:'e', emoji:'🐺', name:'늑대',     hp:130, atk:24, def:4, spd:115, mc:0.65, pas:{ id:'wolf',    name:'사냥 본능',    desc:'적 체력 50% 이하에서 공격 속도 +25%, 이동속도 +10%' } },

function rollTier(min) {
  const list = TIERS.filter((t,i) => i >= (min||0)), total = list.reduce((a,t) => a + t.p, 0);
  let r = Math.random()*total, acc = 0;
  for (const t of list) { acc += t.p; if (r < acc) return t.k; }
  return list[0].k;
}
function rollItem(kind, min) { const tier = rollTier(min), pool = poolOf(kind).filter(x => x.tier === tier); return pool[Math.floor(Math.random()*pool.length)]; }

/* 업그레이드: 같은 아이템을 모을수록 레벨이 오른다 (Lv n 도달에 필요한 누적 보유 수 = 1 + n(n-1)/2) */
const MAXLV = 10;
const needTotal = lv => 1 + lv*(lv-1)/2;
function lvOf(n) { let lv = 0; while (lv < MAXLV && n >= needTotal(lv+1)) lv++; return lv; }
function lvInfo(n) {
  const lv = lvOf(n);
  if (lv >= MAXLV) return { lv, cur:1, need:1, max:true };
  const base = needTotal(lv);
  return { lv, cur:n - base, need:needTotal(lv+1) - base, max:false };
}
const lvMul = lv => 1 + 0.1*(Math.max(1, lv) - 1);
const curLv = (kind, id) => Math.max(1, lvOf(owned(kind, id)));

function fighterStats(b, lv) { const m = tierOf(b.tier).m * lvMul(lv || curLv('f', b.id)); return { hp:Math.round(b.hp*m), atk:Math.round(b.atk*m), def:Math.round(b.def*m), spd:Math.round(b.spd*m) }; }
const skMult = (b, lv) => tierOf(b.tier).m * lvMul(lv || curLv('s', b.id));
function powerOf(st, entries) {
  let p = st.hp/5 + st.atk*3 + st.def*3 + Math.min(st.spd,220)/2;
  for (const en of entries) {
    const b = en.base; let v;
    if (b.shape === 'zone') v = b.heal ? 15*en.mult : (b.tickDmg*en.mult*(b.dur/b.tick))/b.cd*1.2;
    else if (b.shape === 'shower') v = (b.dmg*en.mult*b.n*0.5)/b.cd*2;
    else if (b.shape === 'flurry') v = (b.dmg*en.mult*b.hits*0.4)/b.cd*2;
    else if (b.self || b.shape === 'bind') v = 20*en.mult;
    else v = (b.dmg*en.mult*(b.n||1)*(b.n>1?0.55:1))/b.cd*2;
    p += v;
  }
  return Math.round(p);
}
const skillEntries = () => state.eq.s.filter(Boolean).map(id => ({ base:SK(id), mult:skMult(SK(id)) }));
function myPower() { return state.eq.f ? powerOf(fighterStats(F(state.eq.f)), skillEntries()) : 0; }
function calcStyle(fmc, entries) {
  let sum = fmc, w = 1;
  for (const en of entries) { if (en.base.self) continue; sum += en.base.mc; w += 1; }
  const c = sum / w;
  const label = c < 0.3 ? '원거리 저격형' : c < 0.5 ? '견제형' : c < 0.7 ? '균형형' : '돌격형';
  const desc = c < 0.3 ? '거리를 벌리고 저격하며, 접근하면 이탈해요'
             : c < 0.5 ? '안전거리에서 견제하고 틈을 노려요'
             : c < 0.7 ? '상황에 따라 거리를 조절해 교전해요'
             : '돌진해 근접전을 벌이고 후딜을 노려요';
  return { c, aggr: 0.2 + 0.8*c, pref: 250 + (62-250)*c, label, desc };
}
const myStyle = () => state.eq.f ? calcStyle(F(state.eq.f).mc, skillEntries()) : null;

/* 보스 — 전체적으로 낮춘 난이도, 원거리형은 추가로 약하게 */
function bossStats(stage) {
  const s = stage - 1;
  return { hp: Math.round(115*(1+0.25*s)*(1+0.004*s*s)), atk: Math.round(9+s*2.4), def: Math.round(1+s*0.95), spd: Math.min(125, 80+Math.round(stage*2)) };
}
function bossInfo(stage) {
  const kit = BOSS_KITS[(stage-1) % 3], s = stage - 1;
  const style = calcStyle(kit.fmc, kit.skills.map(id => ({ base:SK(id), mult:1 })));
  const ranged = style.c < 0.5, scale = ranged ? 0.5 : 0.8;
  const st = bossStats(stage);
  if (ranged) { st.hp = Math.round(st.hp*0.72); st.spd = Math.round(st.spd*0.85); }
  st.atk = Math.max(5, Math.round(st.atk*scale));
  const entries = kit.skills.map(id => ({ base:SK(id), mult:(1 + s*0.06)*scale }));
  return { st, emoji:BOSS_EMOJIS[(stage-1) % BOSS_EMOJIS.length], kit, entries, style, ranged };
}
const contribMax = stage => 80 + stage*35;
const clearBonus = stage => 500 + stage*300;
const rangeLabel = mc => mc >= 0.7 ? '근접' : mc <= 0.3 ? '원거리' : '중거리';
function skillDesc(b, mult) {
  const m = mult || 1, p = [], v = x => Math.round(x*m);
  if (b.shape === 'zone') {
    if (b.heal) p.push(`${b.dur}초간 초당 최대 체력 ${(b.heal*100*Math.min(m,3)).toFixed(0)}% 회복`);
    else p.push(`${b.dur}초간 ${b.tick}초마다 ${v(b.tickDmg)} 지속 피해`);
    if (b.zslow) p.push('둔화'); if (b.pull) p.push('끌어당김');
  } else if (b.shape === 'shower') p.push(`유성 ${b.n}발 · 각 ${v(b.dmg)} 피해`);
  else if (b.shape === 'flurry') p.push(`${b.hits}연타 · 각 ${v(b.dmg)} 광역 피해`);
  else if (b.shape === 'buff') { p.push(`${b.dur}초간 공격력 +${Math.round((b.batk-1)*100)}%`); if (b.bspd > 1) p.push(`이동 +${Math.round((b.bspd-1)*100)}%`); if (b.bls) p.push(`${Math.round(b.bls*100)}% 흡혈`); }
  else if (b.shape === 'shield') p.push(`최대 체력 ${Math.round(b.pct*100*Math.min(m,3))}% 보호막 (${b.dur}초)`);
  else if (b.shape === 'heal') p.push(`최대 체력 ${Math.round(b.fxv*100*Math.min(m,4))}% 회복`);
  else if (b.shape === 'bind') p.push(`${b.fxv}초간 기절`);
  else if (b.n > 1) p.push(`${b.n}연발 · 발당 ${v(b.dmg)} 피해`);
  else if (b.dmg) p.push(`피해 ${v(b.dmg)}`);
  if (b.shape === 'rush') p.push('돌진 후 베기');
  if (b.shape === 'blink') p.push('적의 등 뒤로 순간이동');
  if (b.shape === 'strike' || b.shape === 'blast') p.push('범위 지정');
  if (b.fx === 'lifesteal') p.push(`${Math.round(b.fxv*100)}% 흡혈`);
  if (b.fx === 'freeze') p.push(`${b.fxv}초 둔화`);
  if (b.fx === 'poison') p.push('4초 중독');
  if (b.fx === 'stun') p.push(`${b.fxv}초 기절`);
  if (b.fx === 'pull') p.push(`끌어당김 · ${b.fxv}초 기절`);
  p.push(`쿨 ${b.cd}초`);
  return p.join(' · ');
}

/* ---------- 배경 ---------- */
const THEMES = [
  { c0:'#34503f', c1:'#26402f', c2:'#101a15', sl:'170,210,150', sd:'0,0,0', grass:true },   // 초원
  { c0:'#6b5a3a', c1:'#54452c', c2:'#1d160c', sl:'230,205,150', sd:'40,25,5', grass:false }, // 사막
  { c0:'#5b7388', c1:'#42596d', c2:'#141e28', sl:'235,245,255', sd:'10,25,45', grass:false }, // 설원
  { c0:'#4a3430', c1:'#35231f', c2:'#120a09', sl:'255,150,90', sd:'0,0,0', grass:false },    // 화산

function buildBackground(stage) {
  const th = THEMES[Math.floor((stage-1)/3) % THEMES.length], K = 2;
  const c = document.createElement('canvas'); c.width = WW*K; c.height = WH*K;
  const g = c.getContext('2d'); g.scale(K, K);

  grad.addColorStop(0, th.c0); grad.addColorStop(0.55, th.c1); grad.addColorStop(1, th.c2);
  g.fillStyle = grad; g.fillRect(0, 0, WW, WH);
  for (let i = 0; i < 14; i++) {
    const x = rng()*WW, y = rng()*WH, r = 50 + rng()*130, light = rng() > 0.5;
    const pg = g.createRadialGradient(x, y, 0, x, y, r);
    pg.addColorStop(0, light ? `rgba(${th.sl},0.07)` : 'rgba(0,0,0,0.16)'); pg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = pg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  for (let i = 0; i < 1900; i++) { const a = 0.03 + rng()*0.07; g.fillStyle = rng() > 0.5 ? `rgba(${th.sl},${a})` : `rgba(${th.sd},${a+0.03})`; g.fillRect(rng()*WW, rng()*WH, 1 + rng()*1.4, 1 + rng()*1.4); }
  if (th.grass) { g.lineCap = 'round'; for (let i = 0; i < 160; i++) { const x = rng()*WW, y = rng()*WH, l = 3 + rng()*5; g.strokeStyle = `rgba(150,200,130,${0.07 + rng()*0.1})`; g.lineWidth = 1; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rng()-0.5)*3, y - l); g.stroke(); } }
  g.strokeStyle = 'rgba(255,255,255,0.035)'; g.lineWidth = 1;
  for (let x = 80; x < WW; x += 80) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, WH); g.stroke(); }
  for (let y = 80; y < WH; y += 80) { g.beginPath(); g.moveTo(0, y); g.lineTo(WW, y); g.stroke(); }
  for (let i = 0; i < 7; i++) {
    const x = 40 + rng()*(WW-80), y = 40 + rng()*(WH-80), rx = 9 + rng()*14, ry = rx*0.62;
    g.fillStyle = 'rgba(0,0,0,0.28)'; g.beginPath(); g.ellipse(x+3, y+ry*0.5, rx*1.05, ry*0.7, 0, 0, TAU); g.fill();
    const rg = g.createLinearGradient(x, y-ry, x, y+ry); rg.addColorStop(0, '#7b8794'); rg.addColorStop(1, '#3b4551');
    g.fillStyle = rg; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill();

    ${B.firstClear ? row('첫 클리어 보상', `${coin} ${fmt(B.bonus)}`) : ''}
    ${row('가한 피해 / 회피', `${fmt(st.dealt)} / ${st.dodges}회`)}
    <div style="display:grid;grid-template-columns:${B.opts.alt ? '1.5fr 1fr' : '1fr'};gap:.5em;margin-top:.9em">
      <button class="rbtn p" onclick="pickNext('def')"><div class="fill" id="rbFill"></div><span style="position:relative">${defLabel} · <span id="rbSec">3</span></span></button>
      ${B.opts.alt ? `<button class="rbtn g" onclick="pickNext('alt')">반복</button>` : ''}
    </div></div>`;
}
function pickNext(which) {
  if (!B || !B.opts || B.resolved) return;
  B.resolved = true;
  const target = which === 'alt' && B.opts.alt != null ? B.opts.alt : B.opts.def;
  state.sel = clamp(target, 1, state.stage); save();
  startBattle();
  if (tab === 'fight') render();
}

/* ===================== 시작 ===================== */
(function initSplash() {
  $('splashTitle').innerHTML = 'Animal Brawl'.split('').map((ch, i) => ch === ' ' ? '<span style="width:11px"></span>' : `<span style="display:inline-block;animation:letterIn .5s cubic-bezier(.2,.9,.3,1) ${0.06*i}s both">${ch}</span>`).join('');
  const minWait = new Promise(r => setTimeout(r, 2150));
  const fontsReady = Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 3000))]);
  Promise.all([minWait, fontsReady]).then(() => { const sp = $('splash'); sp.classList.add('a-out'); setTimeout(() => sp.remove(), 480); });
})();
render(true);
startBattle();
requestAnimationFrame(loop);
</script>
</body>
</html>
